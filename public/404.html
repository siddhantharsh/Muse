<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — Muse</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: #1c2028;
        color: #eceff4;
        font-family: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
      }
      main { max-width: 440px; }
      .code { color: #88c0d0; font-size: 14px; letter-spacing: 0.1em; }
      h1 { font-size: 28px; line-height: 1.2; margin: 12px 0; }
      p { color: #c5ccd8; line-height: 1.6; margin: 0 0 28px; }
      .links { display: flex; flex-wrap: wrap; gap: 12px; }
      a {
        padding: 11px 18px;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        border: 1px solid #4c566a;
        color: #eceff4;
      }
      a.primary { background: #88c0d0; border-color: #88c0d0; color: #1c2028; }
      a:hover { border-color: #88c0d0; }
      a:focus-visible { outline: 2px solid #88c0d0; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <div class="code">$ muse open — 404</div>
      <h1>This page isn’t on the schedule.</h1>
      <p>The link may be old or mistyped. Your tasks are fine — they live in the app.</p>
      <div class="links">
        <a class="primary" href="/app.html">Open the app</a>
        <a href="/">Go to the homepage</a>
      </div>
    </main>
  </body>
</html>
